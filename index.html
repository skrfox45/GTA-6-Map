<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07181c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>GTA VI • Leonida Gruppenkarte</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#07181c;color:#fff;overflow:hidden}body{overscroll-behavior:none}button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;padding:9px 12px;background:#17333b;color:#fff}button:active{transform:scale(.98)}.primary{background:#f3c64e;color:#111;font-weight:800}.danger{background:#6e2830}
#app{height:100%;display:flex;flex-direction:column}header{height:60px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#050f12;border-bottom:1px solid #234047;z-index:20}.logo{font-weight:900}.sub{font-size:11px;opacity:.6}.tools{margin-left:auto;display:flex;gap:6px}.small{font-size:12px;padding:7px 9px}
#main{flex:1;min-height:0;display:flex}.mapWrap{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#061317;touch-action:none;cursor:grab}.mapWrap.dragging{cursor:grabbing}.map{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:0 0;will-change:transform}.map img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}.map{--map-w:100%}#pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-100%);z-index:3;pointer-events:auto}.pinDot{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 10px #0009}.pinDot i{display:block;width:8px;height:8px;background:#fff;border-radius:50%;margin:7px}.pinLabel{position:absolute;left:18px;top:-5px;background:#08171bd9;border:1px solid #fff3;border-radius:7px;padding:4px 7px;white-space:nowrap;font-size:11px}
#zoom{position:fixed;left:12px;top:72px;z-index:21;display:flex;gap:4px;align-items:center;background:#061317e8;padding:5px;border:1px solid #fff2;border-radius:12px}.zbtn{width:38px;height:38px;padding:0;font-size:21px}.ztext{min-width:48px;text-align:center;font-size:11px;font-weight:800}
#hint{position:absolute;left:12px;bottom:12px;background:#061317dd;border:1px solid #fff2;padding:8px 10px;border-radius:10px;font-size:11px;z-index:4}.status{position:absolute;right:12px;bottom:12px;background:#061317dd;border:1px solid #fff2;padding:7px 9px;border-radius:10px;font-size:10px;z-index:4;opacity:.9}
.panel{width:330px;background:#0b2026;border-left:1px solid #234047;display:flex;flex-direction:column}.panelTop{padding:10px;border-bottom:1px solid #234047}.search{width:100%;background:#07171b;color:#fff;border:1px solid #31555d;border-radius:9px;padding:9px}.legend{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.tag{font-size:10px;border:1px solid #31555d;border-radius:999px;padding:3px 6px}#list{overflow:auto;padding:10px;flex:1}.card{background:#102b32;border:1px solid #23474f;border-radius:12px;padding:10px;margin-bottom:8px}.card strong{display:block}.meta{font-size:11px;opacity:.65;margin-top:3px}.note{font-size:12px;margin-top:6px;opacity:.85}.actions{display:flex;gap:5px;margin-top:8px}.actions button{font-size:11px;padding:6px 8px}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.open{display:flex}.box{width:min(460px,100%);background:#0b2026;border:1px solid #31555d;border-radius:16px;padding:16px}.box h2{margin:0 0 12px}.field{margin:9px 0}.field label{display:block;font-size:11px;opacity:.7;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;background:#07171b;color:#fff;border:1px solid #31555d;border-radius:9px;padding:9px}.field textarea{min-height:85px}.modalActions{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}
@media(max-width:800px){.panel{position:absolute;right:0;top:60px;bottom:0;width:min(340px,90vw);transform:translateX(100%);transition:.2s;z-index:25}.panel.open{transform:translateX(0)}.sub{display:none}.tools .desktop{display:none}.pinLabel{display:none}}
</style>
</head>
<body>
<div id="app">
<header><div><div class="logo">GTA VI • LEONIDA</div><div class="sub">Gruppenkarte • Pins werden lokal gespeichert</div></div>
<div class="tools"><button class="small" onclick="togglePanel()">📍 Pins</button><button class="small desktop" onclick="exportPins()">⬇️ Export</button><button class="small desktop" onclick="document.querySelector('#importFile').click()">⬆️ Import</button><button class="small primary" onclick="sharePins()">💬 Teilen</button><input id="importFile" type="file" accept=".json" hidden onchange="importPins(event)"></div></header>
<div id="main"><div class="mapWrap" id="mapWrap">
<div class="map" id="map"><img id="mapImg" src="https://www.rockstargames.com/VI/_next/static/media/Leonida_Map_Poster.08ir77j-.26ny.jpg?akim=1&amp;imdensity=1&amp;imwidth=3840" alt="Official GTA VI Leonida map"><div id="pins"></div></div>
<div id="zoom"><button class="zbtn" onclick="zoomOut()">−</button><span class="ztext" id="zoomText">100%</span><button class="zbtn" onclick="zoomIn()">+</button><button class="zbtn" onclick="resetView()">⟳</button></div>
<div id="hint">☝️ 1 Finger = bewegen • 2 Finger = verschieben + zoomen • Tippen = Pin</div><div class="status" id="status">Speicher: bereit</div>
</div><aside class="panel" id="panel"><div class="panelTop"><input class="search" id="search" placeholder="Pins suchen…" oninput="render()"><div class="legend"><span class="tag">🔴 Treffpunkt</span><span class="tag">🟢 Geheim</span><span class="tag">🔵 Mission</span><span class="tag">🟣 Shop</span><span class="tag">🟠 Rennen</span></div></div><div id="list"></div></aside></div>
</div>
<div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Pin setzen</h2><div class="field"><label>Name</label><input id="name" autocomplete="off" placeholder="z. B. Unser Treffpunkt"></div><div class="field"><label>Kategorie</label><select id="cat"><option>Treffpunkt</option><option>Geheim</option><option>Mission</option><option>Shop</option><option>Rennen</option><option>Sonstiges</option></select></div><div class="field"><label>Kommentar / Notiz</label><textarea id="note" placeholder="Was sollen die anderen wissen?"></textarea></div><div class="modalActions"><button onclick="closeModal()">Abbrechen</button><button class="primary" onclick="savePin()">Speichern</button></div></div></div>
<script>
const KEY="gta6_leonida_group_v2";
const colors={Treffpunkt:"#e64b4b",Geheim:"#35c96f",Mission:"#4aa3ff",Shop:"#b36cff",Rennen:"#ff9d3d",Sonstiges:"#f3c64e"};
let pins=[],pending=null,editId=null;
let scale=1,tx=0,ty=0;let baseW=0,baseH=0;
let pointers=new Map(),gesture=null,moved=false,downTime=0;
const mapWrap=document.getElementById('mapWrap'),map=document.getElementById('map'),mapImg=document.getElementById('mapImg'),pinsLayer=document.getElementById('pins');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function setStatus(t){document.getElementById('status').textContent=t}
async function loadPins(){
 try{const raw=localStorage.getItem(KEY);if(raw)pins=JSON.parse(raw)||[];setStatus('Speicher: geladen');return}catch(e){}
 try{const db=await openDB();const d=await idbGet(db,KEY);if(d)pins=d;setStatus('Speicher: geladen')}catch(e){setStatus('Speicher: Browser')}
}
async function persist(){
 const data=JSON.stringify(pins);
 try{localStorage.setItem(KEY,data)}catch(e){}
 try{const db=await openDB();await idbPut(db,KEY,pins)}catch(e){}
 setStatus('✓ Gespeichert');setTimeout(()=>setStatus('Speicher: bereit'),1200);
}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('GTA6MapDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('pins');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbPut(db,k,v){return new Promise((res,rej)=>{const t=db.transaction('pins','readwrite');t.objectStore('pins').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function idbGet(db,k){return new Promise((res,rej)=>{const t=db.transaction('pins','readonly');const r=t.objectStore('pins').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function openModal(){modal.classList.add('open');modalTitle.textContent=editId?'Pin bearbeiten':'Pin setzen';if(editId){const p=pins.find(x=>x.id===editId);name.value=p.name;cat.value=p.cat;note.value=p.note||''}else{name.value='';cat.value='Treffpunkt';note.value=''}setTimeout(()=>name.focus(),50)}
function closeModal(){modal.classList.remove('open');pending=null;editId=null}
function savePin(){if(!pending&&!editId)return;if(editId){const p=pins.find(x=>x.id===editId);Object.assign(p,{name:name.value.trim()||'Unbenannter Pin',cat:cat.value,note:note.value.trim()})}else{pins.push({id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2),x:pending.x,y:pending.y,name:name.value.trim()||'Unbenannter Pin',cat:cat.value,note:note.value.trim()})}persist();render();closeModal()}
function render(){pinsLayer.innerHTML='';for(const p of pins){const el=document.createElement('div');el.className='pin';el.style.left=p.x+'%';el.style.top=p.y+'%';el.innerHTML=`<div class="pinDot" style="background:${colors[p.cat]||colors.Sonstiges}"><i></i></div><div class="pinLabel">${esc(p.name)}</div>`;el.onclick=e=>{e.stopPropagation();editId=p.id;openModal()};pinsLayer.appendChild(el)}const q=(search.value||'').toLowerCase();const arr=pins.filter(p=>(p.name+' '+p.cat+' '+(p.note||'')).toLowerCase().includes(q));list.innerHTML=arr.length?arr.slice().reverse().map(p=>`<div class="card"><strong>${esc(p.name)}</strong><div class="meta">${esc(p.cat)}</div>${p.note?`<div class="note">${esc(p.note)}</div>`:''}<div class="actions"><button onclick="focusPin('${p.id}')">📍 Anzeigen</button><button onclick="editPin('${p.id}')">✏️</button><button class="danger" onclick="deletePin('${p.id}')">🗑️</button></div></div>`).join(''):'<div style="opacity:.55;text-align:center;padding:35px 15px">Noch keine Pins.<br><br>Karte tippen.</div>'}
}
function editPin(id){editId=id;openModal()}function deletePin(id){pins=pins.filter(p=>p.id!==id);persist();render()}
function focusPin(id){const p=pins.find(x=>x.id===id);if(!p)return;const px=p.x/100*baseW,py=p.y/100*baseH;const targetScale=Math.max(scale,1.5);const r=mapWrap.getBoundingClientRect();tx=r.width/2-px*targetScale;ty=r.height/2-py*targetScale;scale=targetScale;clampView();applyTransform()}
function togglePanel(){panel.classList.toggle('open')}
function exportPins(){const b=new Blob([JSON.stringify({pins},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='GTA6-Leonida-Pins.json';a.click();URL.revokeObjectURL(a.href)}
function importPins(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.pins))throw 0;pins=d.pins;persist();render();alert('Pins importiert.')}catch{alert('Ungültige Pin-Datei.')}};r.readAsText(f);e.target.value=''}
function sharePins(){if(!pins.length){alert('Setze zuerst einen Pin.');return}const text='🎮 GTA VI – Leonida Gruppenpins\n\n'+pins.map((p,i)=>`${i+1}. ${p.name} [${p.cat}]${p.note?' – '+p.note:''}`).join('\n');const url=location.href.split('#')[0]+'#pins='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(pins)))));if(navigator.share){navigator.share({title:'GTA VI – Leonida Gruppenkarte',text,url}).catch(()=>{})}else{location.href='https://wa.me/?text='+encodeURIComponent(text+'\n\nKarte: '+url)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function applyTransform(){map.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;document.getElementById('zoomText').textContent=Math.round(scale*100)+'%'}
function clampView(){const r=mapWrap.getBoundingClientRect();const w=baseW*scale,h=baseH*scale;const minX=Math.min(0,r.width-w),maxX=Math.max(0,(r.width-w)/2);const minY=Math.min(0,r.height-h),maxY=Math.max(0,(r.height-h)/2);tx=clamp(tx,minX,maxX);ty=clamp(ty,minY,maxY)}
function setZoomAt(newScale,cx,cy){newScale=clamp(newScale,.7,5);const k=newScale/scale;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;scale=newScale;clampView();applyTransform()}
function zoomIn(){const r=mapWrap.getBoundingClientRect();setZoomAt(scale+.25,r.width/2,r.height/2)}function zoomOut(){const r=mapWrap.getBoundingClientRect();setZoomAt(scale-.25,r.width/2,r.height/2)}function resetView(){scale=1;tx=(mapWrap.clientWidth-baseW)/2;ty=Math.max(0,(mapWrap.clientHeight-baseH)/2);applyTransform()}
function mapPointFromClient(clientX,clientY){return{x:((clientX-tx)/scale)/baseW*100,y:((clientY-ty)/scale)/baseH*100}}
function onPointerDown(e){if(e.pointerType==='mouse'&&e.button!==0)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});mapWrap.setPointerCapture?.(e.pointerId);moved=false;downTime=performance.now();if(pointers.size===1){gesture={type:'pan',startX:e.clientX,startY:e.clientY,startTx:tx,startTy:ty}}else if(pointers.size===2){const a=[...pointers.values()];const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);gesture={type:'pinch',startDist:dist,startScale:scale,startTx:tx,startTy:ty,startMid:mid,startMapX:(mid.x-tx)/scale,startMapY:(mid.y-ty)/scale};}mapWrap.classList.add('dragging')}
function onPointerMove(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&gesture?.type==='pan'){const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(Math.hypot(dx,dy)>8)moved=true;tx=gesture.startTx+dx;ty=gesture.startTy+dy;clampView();applyTransform()}else if(pointers.size===2&&gesture?.type==='pinch'){moved=true;const a=[...pointers.values()];const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};const dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);scale=clamp(gesture.startScale*dist/gesture.startDist,.7,5);tx=mid.x-gesture.startMapX*scale;ty=mid.y-gesture.startMapY*scale;clampView();applyTransform()}}
function onPointerUp(e){pointers.delete(e.pointerId);if(pointers.size===0){mapWrap.classList.remove('dragging');if(!moved&&performance.now()-downTime<450){const pt=mapPointFromClient(e.clientX,e.clientY);if(pt.x>=0&&pt.x<=100&&pt.y>=0&&pt.y<=100){pending=pt;editId=null;openModal()}}gesture=null}}
mapWrap.addEventListener('pointerdown',onPointerDown);mapWrap.addEventListener('pointermove',onPointerMove);mapWrap.addEventListener('pointerup',onPointerUp);mapWrap.addEventListener('pointercancel',onPointerUp);
mapImg.addEventListener('load',()=>{const ratio=mapImg.naturalHeight/mapImg.naturalWidth;baseW=mapWrap.clientWidth;baseH=baseW*ratio;map.style.width=baseW+'px';map.style.height=baseH+'px';pinsLayer.style.width='100%';pinsLayer.style.height='100%';resetView();render()});
window.addEventListener('resize',()=>{if(baseW){const ratio=mapImg.naturalHeight/mapImg.naturalWidth;baseW=mapWrap.clientWidth;baseH=baseW*ratio;map.style.width=baseW+'px';map.style.height=baseH+'px';clampView();applyTransform()}});
(async()=>{await loadPins();try{const h=location.hash.match(/^#pins=(.+)$/);if(h){pins=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(h[1])))));await persist();history.replaceState(null,'',location.pathname+location.search);alert('Geteilte Pins wurden geladen.')}}catch(e){}render()})();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
